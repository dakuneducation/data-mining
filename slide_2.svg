  <line x1="12" x2="12.01" y1="16" y2="16" /></g><text x="765.00" y="381.83" font-family="'Poppins','Calibri',Arial,sans-serif" font-size="20.83" font-weight="600" fill="#1B2A33">Positif Palsu (FP): jinak terprediksi ganas</text><text x="693.00" y="437.67" font-family="'Inter','Calibri',Arial,sans-serif" font-size="16.67" font-weight="400" fill="#1B2A33">Pasien jinak mendapat tindak lanjut yang sebenarnya tidak perlu.</text><text x="693.00" y="458.50" font-family="'Inter','Calibri',Arial,sans-serif" font-size="16.67" font-weight="400" fill="#1B2A33">Dampaknya nyata, tetapi berbeda sifat dari kasus ganas yang terlewat.</text><rect x="60.00" y="540.00" width="1213.00" height="135.00" fill="#E9C46A" rx="10.00" fill-opacity="0.12"/><rect x="60.00" y="546.00" width="7.00" height="123.00" fill="#E9C46A" rx="3.50"/><circle cx="112.00" cy="607.50" r="28.00" fill="#E9C46A" fill-opacity="0.15"/><g transform="translate(95.76,591.26) scale(1.3533)" fill="none" stroke="#E9C46A" stroke-width="2.053" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" />
  <path d="M9 18h6" />
  <path d="M10 22h4" /></g><text x="160.00" y="603.33" font-family="'Inter','Calibri',Arial,sans-serif" font-size="16.67" font-weight="400" fill="#1B2A33">Dua model dengan jumlah kesalahan yang sama bisa memperoleh akurasi identik, padahal jumlah ganas yang terlewat bisa berbeda. Karena itu</text><text x="160.00" y="624.17" font-family="'Inter','Calibri',Arial,sans-serif" font-size="16.67" font-weight="400" fill="#1B2A33">pemilihan model harus mengikuti jenis kesalahan yang diprioritaskan, bukan sekadar angka akurasi.</text><text x="60.00" y="722.00" font-family="'Inter','Calibri',Arial,sans-serif" font-size="12.50" font-weight="400" fill="#52636E">Kelompok 5 | Informatika UNSIKA</text><text x="1273.00" y="722.00" font-family="'Inter','Calibri',Arial,sans-serif" font-size="12.50" font-weight="600" fill="#52636E" text-anchor="end">2</text></svg>