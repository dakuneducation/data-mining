  <path d="M12 9v4" />
  <path d="M12 17h.01" /></g><text x="152.00" y="381.83" font-family="'Poppins','Calibri',Arial,sans-serif" font-size="20.83" font-weight="600" fill="#1B2A33">Negatif Palsu (FN): ganas terprediksi jinak</text><text x="80.00" y="437.67" font-family="'Inter','Calibri',Arial,sans-serif" font-size="16.67" font-weight="400" fill="#1B2A33">Kasus ganas yang terlewat. Pada screening, kesalahan ini paling merugikan</text><text x="80.00" y="458.50" font-family="'Inter','Calibri',Arial,sans-serif" font-size="16.67" font-weight="400" fill="#1B2A33">karena menunda penanganan. Akurasi tidak membedakannya dari positif</text><text x="80.00" y="479.33" font-family="'Inter','Calibri',Arial,sans-serif" font-size="16.67" font-weight="400" fill="#1B2A33">palsu.</text><rect x="673.00" y="345.00" width="600.00" height="175.00" fill="#FFFFFF" rx="12.00" stroke="#D5E1E8" stroke-width="1.39" filter="url(#soft)"/><rect x="673.00" y="357.00" width="7.00" height="151.00" fill="#2E86AB"/><circle cx="719.00" cy="391.00" r="28.00" fill="#2E86AB" fill-opacity="0.15"/><g transform="translate(702.76,374.76) scale(1.3533)" fill="none" stroke="#2E86AB" stroke-width="2.053" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
