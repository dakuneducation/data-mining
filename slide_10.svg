            font-family="'Inter','Calibri',Arial,sans-serif" font-size="18.00" font-weight="400" fill="#52636E"
            text-anchor="end">Belajar dari ratusan pohon yang sengaja dibuat</text><text x="1222.40" y="116.29"
            font-family="'Inter','Calibri',Arial,sans-serif" font-size="18.00" font-weight="400" fill="#52636E"
            text-anchor="end">berbeda, lalu hasilnya dipilih lewat suara terbanyak.</text>
        <rect x="58.10" y="142.84" width="662.13" height="317.13" fill="#FFFFFF" rx="13.50" stroke="#B9CCD8"
