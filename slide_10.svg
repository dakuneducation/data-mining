            font-family="'Inter','Calibri',Arial,sans-serif" font-size="15.00" font-weight="400"
            fill="#52636E">dikoreksi oleh pohon lainnya.</text>
        <rect x="57.60" y="476.47" width="323.57" height="123.66" fill="#E3F2EE" rx="14.00" /><text x="77.60" y="507.01"
