            fill="#1B2A33">Kelebihan</text><text x="77.60" y="533.34" font-family="'Inter','Calibri',Arial,sans-serif"
            font-size="15.00" font-weight="400" fill="#1B2A33">Jauh lebih stabil dan tahan overfit</text><text x="77.60"
            y="555.84" font-family="'Inter','Calibri',Arial,sans-serif" font-size="15.00" font-weight="400"
            fill="#1B2A33">dibanding satu decision tree.</text>
        <rect x="397.17" y="476.47" width="323.57" height="123.66" fill="#FBE6E8" rx="14.00" /><text x="417.17"
            y="507.01" font-family="'Inter','Calibri',Arial,sans-serif" font-size="15.00" font-weight="700"
            fill="#1B2A33">Keterbatasan</text><text x="417.17" y="533.34"
