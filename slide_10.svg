            font-size="13.00" font-weight="600" fill="#52636E" letter-spacing="1.04">05 / 06 · ENSEMBLE</text>
        <circle cx="68.60" cy="95.04" r="11.00" fill="#D1495B" /><text x="95.60" y="114.02"
