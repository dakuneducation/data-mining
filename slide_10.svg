            font-family="'Inter','Calibri',Arial,sans-serif" font-size="15.00" font-weight="400"
            fill="#1B2A33">sederhana, dan pelatihannya lebih</text><text x="417.17" y="578.34"
            font-family="'Inter','Calibri',Arial,sans-serif" font-size="15.00" font-weight="400"
            fill="#1B2A33">lama.</text>
