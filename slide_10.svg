            font-family="'Plus Jakarta Sans','Poppins','Calibri',Arial,sans-serif" font-size="20.00" font-weight="800"
            fill="#1B2A33">Cara kerja: bagging trees + subset fitur acak</text>
        <circle cx="98.60" cy="222.34" r="16.00" fill="#F8DADD" /><text x="98.60" y="227.80"
            font-family="'Inter','Calibri',Arial,sans-serif" font-size="15.00" font-weight="700" fill="#1B2A33"
            text-anchor="middle">1</text><text x="128.60" y="221.85" font-family="'Inter','Calibri',Arial,sans-serif"
            font-size="16.00" font-weight="600" fill="#1B2A33">Tiap pohon dilatih dari sampel acak</text><text
            x="128.60" y="244.42" font-family="'Inter','Calibri',Arial,sans-serif" font-size="15.00" font-weight="400"
            fill="#52636E">Bagging: setiap pohon memakai sampel bootstrap, yaitu data latih yang</text><text x="128.60"
            y="266.92" font-family="'Inter','Calibri',Arial,sans-serif" font-size="15.00" font-weight="400"
            fill="#52636E">diambil acak dengan pengembalian.</text>
        <circle cx="98.60" cy="304.72" r="16.00" fill="#F8DADD" /><text x="98.60" y="310.17"
            font-family="'Inter','Calibri',Arial,sans-serif" font-size="15.00" font-weight="700" fill="#1B2A33"
            text-anchor="middle">2</text><text x="128.60" y="304.22" font-family="'Inter','Calibri',Arial,sans-serif"
            font-size="16.00" font-weight="600" fill="#1B2A33">Tiap pemecahan hanya melihat sebagian fitur</text><text
            x="128.60" y="326.80" font-family="'Inter','Calibri',Arial,sans-serif" font-size="15.00" font-weight="400"
            fill="#52636E">Pada setiap split, hanya mtry fitur yang dipilih acak yang boleh</text><text x="128.60"
            y="349.30" font-family="'Inter','Calibri',Arial,sans-serif" font-size="15.00" font-weight="400"
            fill="#52636E">dipertimbangkan, sehingga pohon-pohonnya tidak saling meniru.</text>
        <circle cx="98.60" cy="387.10" r="16.00" fill="#F8DADD" /><text x="98.60" y="392.55"
            font-family="'Inter','Calibri',Arial,sans-serif" font-size="15.00" font-weight="700" fill="#1B2A33"
            text-anchor="middle">3</text><text x="128.60" y="386.60" font-family="'Inter','Calibri',Arial,sans-serif"
            font-size="16.00" font-weight="600" fill="#1B2A33">500 pohon memberi suara</text><text x="128.60" y="409.17"
            font-family="'Inter','Calibri',Arial,sans-serif" font-size="15.00" font-weight="400" fill="#52636E">Kelas
